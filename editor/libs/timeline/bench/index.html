<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Timeline rendering bench</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111214;
        color: #d8dae0;
        font:
          12px ui-monospace,
          monospace;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      #progress {
        position: fixed;
        left: 8px;
        bottom: 8px;
        margin: 0;
      }
      #status {
        position: fixed;
        right: 8px;
        bottom: 8px;
        max-width: 480px;
        max-height: 80vh;
        overflow: auto;
        margin: 0;
        padding: 6px 8px;
        background: rgb(0 0 0 / 0.7);
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <canvas id="timeline"></canvas>
    <pre id="status">Starting…</pre>
    <pre id="progress"></pre>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
